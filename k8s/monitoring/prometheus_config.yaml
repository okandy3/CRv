apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'backend'
        metrics_path: /metrics
        static_configs:
          - targets: ['backend-service:7000']

      - job_name: 'redis'
        static_configs:
          - targets: ['redis-exporter:9121']

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s

    scrape_configs:
      - job_name: 'backend'
        static_configs:
          - targets: ['10.244.0.73:7000', '10.244.0.77:7000']

      - job_name: 'redis'
        static_configs:
          - targets: ['redis-exporter:9121']

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observabilite
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      # Job pour récupérer les métriques de Node-Redis
      - job_name: 'node-redis'
        metrics_path: /metrics
        static_configs:
          - targets: ['node-redis:8080']

      # Job pour récupérer les métriques de Redis via Redis Exporter
      - job_name: 'redis-main'
        static_configs:
          - targets: ['redis-exporter:9121']

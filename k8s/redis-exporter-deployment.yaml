apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: observabilite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter
          imagePullPolicy: Always
          ports:
            - containerPort: 9121
          env:
            - name: REDIS_ADDR
              value: "redis-main:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: observabilite
spec:
  selector:
    app: redis-exporter
  ports:
    - port: 9121
      targetPort: 9121
